# audio.cpp — Build and publish Docker images
#
# Automatic builds: CUDA 12 and CUDA 13 on amd64 only.
# Also packages Linux amd64 CUDA binaries from those images for GitHub Releases.
# Manual builds can select cpu/cuda12/cuda13/vulkan and amd64/arm64.
# Produces images on ghcr.io:
#   full-cpu                     (latest, mutable)
#   full-cpu-YYYYMMDD-HHHHHHH    (pinned to date + short SHA, immutable)
#   full-cuda12                  (latest, mutable)
#   full-cuda12-YYYYMMDD-HHHHHHH (pinned to date + short SHA, immutable)
#   full-cuda13                  (latest, mutable)
#   full-cuda13-YYYYMMDD-HHHHHHH (pinned to date + short SHA, immutable)
#   full-vulkan                  (latest, mutable)
#   full-vulkan-YYYYMMDD-HHHHHHH (pinned to date + short SHA, immutable)
#   full-<backend>-v<version>    (created by version-tag builds)

name: Build and publish images and binaries

on:
  push:
    tags:
      - 'v*'
  # or when triggered manually
  workflow_dispatch:
    inputs:
      version:
        description: 'audio.cpp version string embedded in the binaries'
        type: string
        default: dev
      backends:
        description: 'Comma-separated backends: cpu,cuda12,cuda13,vulkan'
        type: string
        default: cuda12,cuda13
      architectures:
        description: 'Comma-separated architectures: amd64,arm64'
        type: string
        default: amd64

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # ── Shared metadata (date computed once for all jobs) ───────────────────────
  metadata:
    name: Generate metadata
    runs-on: ubuntu-24.04
    outputs:
      short_sha: ${{ steps.revision.outputs.short_sha }}
      build_date: ${{ steps.date.outputs.date }}
      date_tag:   ${{ steps.date.outputs.tag }}
      app_version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      image_repo: ${{ steps.image_repo.outputs.image_repo }}
      build_matrix: ${{ steps.matrix.outputs.build_matrix }}
      merge_matrix: ${{ steps.matrix.outputs.merge_matrix }}
      binary_backends: ${{ steps.matrix.outputs.binary_backends }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve revision
        id: revision
        run: echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Test standalone archive packaging
        run: python3 tests/unittests/test_package_cuda_binaries.py

      - name: Select build targets
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BACKENDS: ${{ inputs.backends }}
          INPUT_ARCHITECTURES: ${{ inputs.architectures }}
        run: |
          python3 - <<'PY'
          import json
          import os

          def select(value, default, allowed):
              items = list(dict.fromkeys(item.strip() for item in (value or default).split(',')))
              if not items or any(item not in allowed for item in items):
                  raise SystemExit(f"Invalid selection {value!r}; choose from {', '.join(allowed)}")
              return items

          manual = os.environ['EVENT_NAME'] == 'workflow_dispatch'
          backends = select(os.environ['INPUT_BACKENDS'] if manual else '',
                            'cuda12,cuda13', ['cpu', 'cuda12', 'cuda13', 'vulkan'])
          arches = select(os.environ['INPUT_ARCHITECTURES'] if manual else '',
                          'amd64', ['amd64', 'arm64'])
          builds = []
          for backend in backends:
              for arch in arches:
                  entry = {
                      'tag': backend,
                      'dockerfile': f".devops/{'cuda' if backend.startswith('cuda') else backend}.Dockerfile",
                      'platforms': f'linux/{arch}',
                      'arch': arch,
                      'runs_on': 'ubuntu-24.04-arm' if arch == 'arm64' else 'ubuntu-24.04',
                      'cuda_version': {'cuda12': '12.9.2', 'cuda13': '13.3.0'}.get(backend, ''),
                  }
                  builds.append(entry)
          merges = [{'tag': backend, 'arches': ' '.join(arches)} for backend in backends]
          binaries = [backend for backend in backends if backend.startswith('cuda') and 'amd64' in arches]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('build_matrix=' + json.dumps({'include': builds}), file=output)
              print('merge_matrix=' + json.dumps({'include': merges}), file=output)
              print('binary_backends=' + ' '.join(binaries), file=output)
          print('Selected targets: ' + ', '.join(f"{entry['tag']}/{entry['arch']}" for entry in builds))
          PY

      - name: Get build date
        id: date
        run: |
          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "tag=$(date -u +'%Y%m%d')" >> "$GITHUB_OUTPUT"

      - name: Resolve app version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          RELEASE_TAG=""
          if [[ "$REF_TYPE" == 'tag' ]]; then
            # Keep full-<backend>-<tag> within Docker's 128-character tag limit.
            if [[ ! "$REF_NAME" =~ ^v[A-Za-z0-9_.-]{1,115}$ ]]; then
              echo "::error::Version tag must use Docker-compatible characters (letters, digits, _, ., -) and be at most 116 characters."
              exit 1
            fi
            RELEASE_TAG="$REF_NAME"
            VERSION="$REF_NAME"
          else
            VERSION="$INPUT_VERSION"
          fi
          if [[ -z "$VERSION" ]]; then
            VERSION="dev"
          fi
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Determine lowercase image repository
        id: image_repo
        run: echo "image_repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  # ── Build each arch, push by digest ─────────────────────────────────────────
  build:
    name: Build (${{ matrix.tag }}, ${{ matrix.platforms }})
    needs: metadata
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.build_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: full
          platforms: ${{ matrix.platforms }}
          provenance: false
          outputs: type=image,name=ghcr.io/${{ needs.metadata.outputs.image_repo }},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true
          build-args: |
            BUILD_DATE=${{ needs.metadata.outputs.build_date }}
            APP_VERSION=${{ needs.metadata.outputs.app_version }}
            AUDIOCPP_VERSION=${{ needs.metadata.outputs.app_version }}
            APP_REVISION=${{ github.sha }}
            IMAGE_URL=${{ github.server_url }}/${{ github.repository }}
            IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}
            ${{ matrix.cuda_version && format('CUDA_VERSION={0}', matrix.cuda_version) || '' }}
          cache-from: type=registry,ref=ghcr.io/${{ needs.metadata.outputs.image_repo }}:cache-${{ matrix.arch }}-${{ matrix.tag }}
          cache-to: type=registry,ref=ghcr.io/${{ needs.metadata.outputs.image_repo }}:cache-${{ matrix.arch }}-${{ matrix.tag }},mode=max

      - name: Package Linux amd64 CUDA binaries from image
        if: ${{ matrix.arch == 'amd64' && startsWith(matrix.tag, 'cuda') }}
        env:
          IMAGE: ghcr.io/${{ needs.metadata.outputs.image_repo }}@${{ steps.push.outputs.digest }}
          PACKAGE_VERSION: v${{ needs.metadata.outputs.app_version }}
          CUDA_BACKEND: ${{ matrix.tag }}
          CUDA_VERSION: ${{ matrix.cuda_version }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # No container entrypoint, GPU, or second compilation is involved.
          docker run --rm --platform linux/amd64 --network none \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/source:ro" --volume "$PWD/dist:/dist" \
            --entrypoint python3 "$IMAGE" /source/tools/package_cuda_binaries.py \
            --output-dir /dist --source-dir /source --version "$PACKAGE_VERSION" \
            --backend "$CUDA_BACKEND" --cuda-version "$CUDA_VERSION" --revision "$REVISION"
          (cd dist && sha256sum --check ./*.sha256)

      - name: Save binary archive
        if: ${{ matrix.arch == 'amd64' && startsWith(matrix.tag, 'cuda') }}
        uses: actions/upload-artifact@v7
        with:
          name: binary-linux-amd64-${{ matrix.tag }}
          path: dist/*
          compression-level: 0
          if-no-files-found: error

      - name: Upload digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"

          if [[ "$digest" != sha256:* ]]; then
            echo "::error::Invalid digest format: $digest"
            exit 1
          fi

          printf '%s\n' "$digest" > "/tmp/digests/${{ matrix.tag }}-${{ matrix.arch }}.txt"

      - name: Save digest artifact
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}-${{ matrix.tag }}
          path: /tmp/digests/
          if-no-files-found: error

  # ── Merge per-arch digests into multi-arch manifests ────────────────────────
  merge:
    name: Merge (${{ matrix.tag }})
    needs: [metadata, build]
    # Publish only after every selected target has built successfully.
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.merge_matrix) }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Create manifest
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
          EXPECTED_ARCHES: ${{ matrix.arches }}
        run: |
          set -euo pipefail

          repo="ghcr.io/${{ needs.metadata.outputs.image_repo }}"
          date_tag="${{ needs.metadata.outputs.date_tag }}"
          short_sha="${{ needs.metadata.outputs.short_sha }}"
          tag="${{ matrix.tag }}"
          build_date="${{ needs.metadata.outputs.build_date }}"
          image_url="${{ github.server_url }}/${{ github.repository }}"

          mutable="full-${tag}"
          immutable="full-${tag}-${date_tag}-${short_sha}"

          # Every selected architecture must have produced a digest before publishing.
          read -r -a expected_arches <<< "$EXPECTED_ARCHES"
          refs=()
          for arch in "${expected_arches[@]}"; do
            file="/tmp/digests/${tag}-${arch}.txt"
            if [[ ! -s "$file" ]]; then
              echo "::error::Missing digest for ${tag}/${arch}"
              exit 1
            fi
            refs+=("${repo}@$(cat "$file")")
          done

          echo "${tag}: ${#refs[@]}/${#expected_arches[@]} digests merged"

          # OCI annotations for the merged manifest
          annotations=(
            --annotation "index:org.opencontainers.image.created=${build_date}"
            --annotation "index:org.opencontainers.image.revision=${{ github.sha }}"
            --annotation "index:org.opencontainers.image.url=${image_url}"
            --annotation "index:org.opencontainers.image.source=${image_url}"
          )

          echo "  → ${mutable}"
          docker buildx imagetools create "${annotations[@]}" --tag "${repo}:${mutable}" "${refs[@]}"

          echo "  → ${immutable}"
          docker buildx imagetools create "${annotations[@]}" --tag "${repo}:${immutable}" "${refs[@]}"

          if [[ -n "$RELEASE_TAG" ]]; then
            versioned="full-${tag}-${RELEASE_TAG}"
            echo "  → ${versioned}"
            docker buildx imagetools create "${annotations[@]}" --tag "${repo}:${versioned}" "${refs[@]}"
          fi

  publish-binaries:
    name: Publish CUDA binary archives
    needs: [metadata, build, merge]
    if: ${{ needs.metadata.outputs.release_tag != '' && needs.metadata.outputs.binary_backends != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download binary archives
        uses: actions/download-artifact@v8
        with:
          pattern: binary-linux-amd64-*
          path: dist
          merge-multiple: true

      - name: Publish archives to the tag's GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
          BINARY_BACKENDS: ${{ needs.metadata.outputs.binary_backends }}
        run: |
          set -euo pipefail
          cd dist
          files=()
          for backend in $BINARY_BACKENDS; do
            archive="audio-${RELEASE_TAG}-bin-linux-amd64-${backend}.tar.gz"
            test -s "$archive"
            sha256sum --check "${archive}.sha256"
            files+=("$archive" "${archive}.sha256")
          done
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          else
            flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${files[@]}" --verify-tag \
              --title "$RELEASE_TAG" --generate-notes "${flags[@]}"
          fi
